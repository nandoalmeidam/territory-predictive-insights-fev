# Nome da aplicacao
spring.application.name=pluvia

# Banco de dados H2 persistente
spring.datasource.url=jdbc:h2:file:./dados/pluvia
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracoes do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Exibir comandos SQL no console
spring.jpa.show-sql=false

# Console H2 (utilizaremos se habilitarmos suporte web)
spring.h2.console.enabled=false

# Exibe apenas avisos e erros nos logs gerais.
logging.level.root=WARN

# Remove o banner do Spring Boot.
spring.main.banner-mode=off
